[project]
name = "nonebot-plugin-crystelf"
version = "0.1.6"
description = "移植自 crystelf-plugin 的多功能群娱乐插件：60s 早报、新人验证、入群欢迎、表情回应、戳一戳、早晚安"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "TonyLiangP2010405", email = "" },
]
keywords = ["nonebot", "nonebot2", "plugin", "crystelf", "group", "entertainment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "nonebot2>=2.2.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.24.0",
    "regex>=2023.0.0",
]

[project.optional-dependencies]
dev = [
    "nonebot2[fastapi]>=2.2.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "nonebug>=0.3",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/TonyLiangP2010405/nonebot-plugin-crystelf"
Repository = "https://github.com/TonyLiangP2010405/nonebot-plugin-crystelf"

[tool.nonebot]
plugins = ["nonebot_plugin_crystelf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_crystelf"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
